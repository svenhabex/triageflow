<div class="flex flex-col gap-4">
  <h3 class="text-2xl font-semibold mb-2">Triage Result</h3>
  <p-panel>
    <div class="flex flex-col gap-6">
      <!-- Risk Level Bar -->
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <div class="flex grow-1">
            <span
              [class]="`flex items-baseline border py-2 px-4 rounded-sm ${esiBorderColor()} ${esiBackgroundColorLight()}`"
            >
              <span class="text-sm mr-2">ESI level:</span>
              <span class="text-3xl font-bold">{{ result().esiLevel }}</span>
            </span>
          </div>
          <div class="flex items-center gap-2">
            <i [class]="`pi ${esiColor()} ${urgencyInfo().icon}`"></i>
            <span [class]="`text-sm font-medium ${esiColor()}`">
              {{ urgencyInfo().description }}
            </span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div [class]="`risk-progress-bar ${esiProgressColor()}`">
          <p-progressBar [value]="progressValue()" [showValue]="false" />
        </div>

        <!-- Level Indicators -->
        <div class="flex justify-between items-center px-1">
          @for (indicator of levelIndicators(); track indicator.level) {
            <div class="flex flex-col items-center gap-1">
              <div
                [class]="`w-3 h-3 rounded-full border-2 transition-all duration-300 ${esiColor()}`"
                [class.bg-current]="indicator.isActive"
                [class.border-current]="indicator.isActive"
                [class.border-gray-300]="!indicator.isActive"
                [class.scale-125]="indicator.isCurrentLevel"
              ></div>
              <span
                [class]="`text-xs font-medium transition-colors duration-300 ${indicator.isActive ? esiColor() : 'text-gray-400'}`"
                [class.text-current]="indicator.isActive"
                [class.text-gray-400]="!indicator.isActive"
              >
                {{ indicator.level }}
              </span>
            </div>
          }
        </div>
      </div>

      <p>
        <span class="font-semibold">Reasoning:</span><br />
        {{ result().reasoning }}
      </p>
      <p>
        <span class="block mb-2 font-semibold">Medical Category:</span>
        <p-tag
          severity="info"
          [rounded]="true"
          [value]="result().medicalCategory"
        />
      </p>
    </div>
  </p-panel>
</div>
