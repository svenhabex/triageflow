<div class="flex flex-col justify-end h-full w-full gap-8">
  <div #scrollContainer class="flex flex-col gap-10 px-4 overflow-auto">
    @for (item of output(); track $index) {
      @switch (item.type) {
        @case (TriageTrackerOutputTypeEnum.Message) {
          <flow-message-bubble
            [content]="item.data.content"
            [type]="item.data.type"
          />
        }
        @case (TriageTrackerOutputTypeEnum.Intake) {
          <flow-intake-result [result]="item.data" />
        }
        @case (TriageTrackerOutputTypeEnum.Triage) {
          <flow-triage-result [result]="item.data" />
        }
      }
    }

    @if (isLoading()) {
      <div class="flex flex-col items-center gap-4">
        <flow-chat-loading class="w-full" />

        @if (loadingText()) {
          <p
            class="drop-shadow-[0_0_12px_rgba(156,163,175,0.6)] font-semibold text-center"
            style="animation: pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite"
          >
            {{ loadingText() }}
          </p>
        }
      </div>
    }
  </div>

  <div class="px-4">
    <form
      class="flex items-end gap-4 rounded-xl bg-white shadow-xl"
      [formGroup]="form"
      (ngSubmit)="triggerSendMessage()"
    >
      <textarea
        name="input"
        class="flex-1 p-4 field-sizing-content border-none bg-transparent h-full max-h-[400px] resize-none outline-none placeholder:text-surface-400"
        pTextarea
        formControlName="message"
        placeholder="Fill in the conversation with the patient..."
        (keydown)="onKeyDown($event)"
      ></textarea>
      <div class="flex pr-4 pb-4 pt-4">
        <button pButton icon="pi pi-arrow-up" severity="contrast" type="submit">
          Send
        </button>
      </div>
    </form>
  </div>
</div>
